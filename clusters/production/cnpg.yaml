apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: helm-installs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/cnpg/production
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg