apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm-installs
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 30m
  dependsOn:
    - name: helm-repos
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/production/helm-installs
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg