apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-webhook
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
        kubernetes.io/instance: ingress-nginx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: echo