apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auth
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: crds
    - name: cnpg
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/local/auth
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg