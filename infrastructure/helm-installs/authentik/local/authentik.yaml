apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  chart:
    spec:
      chart: authentik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      version: '*'
  interval: 5m0s
  timeout: 5m
  valuesFrom:
    - kind: Secret
      name: authentik-secret
      valuesKey: secretkey
      targetPath: authentik.secret_key
      optional: false
    - kind: Secret
      name: authentik-secret
      valuesKey: username
      targetPath: authentik.postgresql.user
      optional: false
    - kind: Secret
      name: authentik-secret
      valuesKey: password
      targetPath: authentik.postgresql.password
      optional: false
    - kind: Secret
      name: authentik-secret
      valuesKey: redis-password
      targetPath: authentik.redis.password
      optional: false
  values:
    authentik:
      # This sends anonymous usage-data, stack traces on errors and
      # performance data to sentry.io, and is fully opt-in
      error_reporting:
        enabled: false
      postgresql:
        host: pg-cluster-authentik-rw.cnpg.svc.cluster.local
        port: 5432
        name: authentik
      redis:
        host: redis-master.redis.svc.cluster.local
    server:
      replicas: 1
    worker:
      replicas: 1