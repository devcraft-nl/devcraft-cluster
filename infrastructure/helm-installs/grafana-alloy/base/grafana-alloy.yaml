apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-alloy
  namespace: grafana-stack
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: "1.2.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  values:
    alloy:
      configMap:
        create: false
        name: alloy-config
        key: config.alloy
      envFrom:
        - secretRef:
            name: loki-credentials
            optional: false