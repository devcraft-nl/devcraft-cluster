apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: redis
spec:
  chartRef:
    kind: OCIRepository
    name: redis
    namespace: flux-system
  interval: 5m0s
  timeout: 5m
  values:
    auth:
      existingSecret: redis-secret
      existingSecretPasswordKey: password