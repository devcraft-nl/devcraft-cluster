apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak-operator
spec:
  instances: 1
  ingress:
    enabled: false
  db:
    vendor: postgres
    host: pg-cluster-keycloak-rw.keycloak-operator.svc.cluster.local
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
    tlsSecret: auth-dkroesen-tls-secret
  hostname:
    hostname: auth.dkroesen.nl
    strict: false
  proxy:
    headers: xforwarded # double check your reverse proxy sets and overwrites the X-Forwarded-* headers