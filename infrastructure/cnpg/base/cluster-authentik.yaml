apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster-authentik
  namespace: cnpg
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 17
  storage:
    size: 1Gi
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: auth-user
  superuserSecret:
    name: superuser
  monitoring:
    enablePodMonitor: true